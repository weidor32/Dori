<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Doris's Rating Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile-style.css">
</head>
<body>
    <!-- NAVBAR SECTION -->
    <nav class="navbar">
        <div class="navbar-left">
            <span class="back-button" onclick="goHome()">← Back</span>
        </div>
        
        <div class="navbar-center">
            <h1 class="profile-title">👤 My Profile</h1>
        </div>
        
        <div class="navbar-right">
        </div>
    </nav>

    <!-- PROFILE CONTAINER -->
    <div class="profile-container">
        
        <!-- PROFILE CARD -->
        <div class="profile-card">
            <div class="profile-header">
                <h2>Your Profile</h2>
            </div>
            
            <div class="profile-content">
                <!-- PROFILE PICTURE -->
                <div class="profile-picture-section">
                    <div class="profile-picture-container">
                        <img id="profile-picture" class="profile-picture" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='30' r='20' fill='%23FFB6C1'/%3E%3Cellipse cx='50' cy='70' rx='30' ry='25' fill='%23FFB6C1'/%3E%3C/svg%3E" alt="Profile Picture">
                    </div>
                    <button class="upload-picture-btn" onclick="document.getElementById('profile-pic-input').click()">📸 Change Picture</button>
                    <input type="file" id="profile-pic-input" accept="image/*" onchange="updateProfilePicture(event)" style="display: none;">
                </div>
                
                <!-- ABOUT ME SECTION -->
                <div class="about-me-section">
                    <label for="about-me-input">📝 About Me:</label>
                    <textarea 
                        id="about-me-input" 
                        class="about-me-input" 
                        placeholder="Tell us about yourself! What do you love? What are your hobbies?"
                        maxlength="500"
                    ></textarea>
                    <div class="character-count">
                        <span id="char-count">0</span>/500
                    </div>
                </div>
            </div>
            
            <div class="profile-buttons">
                <button class="save-button" onclick="saveProfile()">💾 Save Profile</button>
                <button class="make-rating-btn" onclick="goToMakeRating()">⭐ Make a Rating</button>
            </div>
        </div>

        <!-- LIKED POSTS SECTION -->
        <div class="liked-posts-card">
            <div class="liked-posts-header">
                <h2>❤️ Your Liked Posts</h2>
            </div>
            
            <div class="liked-posts-content" id="liked-posts-container">
                <p class="no-liked-posts">You haven't liked any posts yet! 💔</p>
            </div>
        </div>

    </div>

    <!-- SCRIPT -->
    <script src="profile.js"></script>
</body>
</html>
